name: DAMIDAMI production playback

on:
  workflow_dispatch:

jobs:
  anonymous-playback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify native source decoder
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText("$pwd/desktop/src/main/resources/parity/build-info.properties", "commit=$env:GITHUB_SHA`n", [System.Text.UTF8Encoding]::new($false))
          python tools/verify_decoder_bundle.py --sources --run --output desktop/build/damidami/source-decoder.json
      - name: Anonymous production Search and real Windows FFmpeg playback
        run: python tools/capture_damidami.py search --home desktop/build/damidami/search-home --output desktop/build/damidami/search
      - name: Production Windows lyric rendering with pinned MiLan Pro
        run: python tools/capture_damidami.py lyrics --home desktop/build/damidami/lyrics-home --output desktop/build/damidami/lyrics --width 1100 --height 780
      - name: Upload sanitized metrics, UI and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAMIDAMI-Windows-${{ github.sha }}
          path: |
            desktop/build/damidami/source-decoder.json
            desktop/build/damidami/search/*.json
            desktop/build/damidami/search/*.png
            desktop/build/damidami/search/*.txt
            desktop/build/damidami/search/*.log
            desktop/build/damidami/lyrics/*.json
            desktop/build/damidami/lyrics/*.png
            desktop/build/damidami/lyrics/*.txt
            desktop/build/damidami/lyrics/*.log
          if-no-files-found: error
