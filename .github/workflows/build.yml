name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: gradle :desktop:packageUberJarForCurrentOS
      - name: Get jar info
        id: jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem desktop/build/compose/jars/*.jar | Select-Object -First 1
          echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
          echo "jar_name=$($jar.Name)" >> $env:GITHUB_OUTPUT
          echo "jar_dir=$($jar.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "jar_size=$($jar.Length)" >> $env:GITHUB_OUTPUT
          echo "Found: $($jar.Name) ($($jar.Length) bytes)"
      - name: Create app-image with jpackage (system JDK)
        shell: pwsh
        run: |
          jpackage --type app-image `
            --input "${{ steps.jar.outputs.jar_dir }}" `
            --main-jar "${{ steps.jar.outputs.jar_name }}" `
            --name MeloX-Desktop `
            --dest desktop/build/releases `
            --java-options "-Xmx1g" `
            --add-modules jdk.accessibility
      - name: Diagnose output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/build/releases/MeloX-Desktop/ | ForEach-Object { Write-Output "$($_.FullName) ($($_.Length) bytes)" }
          $java = Get-ChildItem -Recurse desktop/build/releases/MeloX-Desktop/ -Filter "java.exe" | Select-Object -First 1
          if ($java) {
            Write-Output "Found java.exe at: $($java.FullName)"
            & $java.FullName --list-modules 2>&1 | ForEach-Object { Write-Output $_ }
          } else {
            Write-Output "WARNING: java.exe not found in output"
          }
      - name: Zip the app-image
        shell: pwsh
        run: |
          Compress-Archive -Path "desktop/build/releases/MeloX-Desktop/*" -DestinationPath "desktop/build/releases/MeloX-Desktop-Windows.zip"
          $zip = Get-Item "desktop/build/releases/MeloX-Desktop-Windows.zip"
          Write-Output "Zip: $($zip.FullName) ($($zip.Length) bytes)"
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Desktop-${{ runner.os }}
          path: desktop/build/releases/MeloX-Desktop-Windows.zip
          if-no-files-found: error
