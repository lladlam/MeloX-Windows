name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Build shared module
        run: gradle :shared:compileKotlinDesktop
      
      - name: Build desktop module
        run: gradle :desktop:compileKotlinDesktop
      
      - name: Run full build
        run: gradle :desktop:packageUberJarForCurrentOS
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Desktop
          path: desktop/build/libs/desktop-*.jar
          if-no-files-found: warn
