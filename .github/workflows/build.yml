name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build exe via Gradle Compose plugin
        run: gradle :desktop:packageExe
      - name: List output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/build/compose/binaries/main/exe/ | ForEach-Object { Write-Output "$($_.FullName) ($($_.Length) bytes)" }
      - name: Diagnose runtime modules
        if: always()
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -Recurse desktop/build/compose/binaries/main/exe/ -Filter "java.exe" | Select-Object -First 1
          if ($runtime) {
            Write-Output "Found java.exe at: $($runtime.FullName)"
            & $runtime.FullName --list-modules 2>&1 | ForEach-Object { Write-Output $_ }
          } else {
            Write-Output "java.exe not found in output"
          }
      - name: Test run (headless)
        if: always()
        shell: pwsh
        run: |
          $app = Get-ChildItem -Recurse desktop/build/compose/binaries/main/exe/ -Filter "MeloX-Desktop.bat" | Select-Object -First 1
          if (-not $app) {
            $app = Get-ChildItem -Recurse desktop/build/compose/binaries/main/exe/ -Filter "MeloX-Desktop.exe" | Select-Object -First 1
          }
          if ($app) {
            Write-Output "Found launcher: $($app.FullName)"
            Start-Process -FilePath $app.FullName -ArgumentList "--help" -NoNewWindow -Wait -PassThru 2>&1 | ForEach-Object { Write-Output $_ }
          }
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Desktop-${{ runner.os }}
          path: desktop/build/compose/binaries/main/exe/**
          if-no-files-found: error
