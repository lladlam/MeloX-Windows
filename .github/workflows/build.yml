name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build exe via Gradle Compose plugin
        run: gradle :desktop:packageExe
      - name: List output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/build/compose/binaries/main/exe/ | ForEach-Object { Write-Output "$($_.FullName) ($($_.Length) bytes)" }
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Desktop-${{ runner.os }}
          path: desktop/build/compose/binaries/main/exe/**
          if-no-files-found: error
