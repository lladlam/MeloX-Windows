name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Stamp exact package source revision
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText("$pwd/desktop/src/main/resources/parity/build-info.properties", "commit=$env:GITHUB_SHA`n", [System.Text.UTF8Encoding]::new($false))
      - name: Verify LFS binaries and native decoder
        run: python tools/verify_decoder_bundle.py --sources --run --output desktop/build/verification/source-decoder.json
      - name: Verify pinned source resource bytes
        run: python tools/verify_pinned_resources.py --sources --output desktop/build/verification/source-pinned-resources.json
      - name: Verify axis-frozen MiLan Pro instances from pinned variable source
        shell: pwsh
        run: |
          python -m pip install --quiet "fonttools>=4.55" uharfbuzz
          python tools/generate_lanting_static.py --verify
      - name: Build uber jar
        run: gradle :shared:desktopTest :desktop:packageUberJarForCurrentOS
      - name: Verify native equalizer PCM
        run: python tools/verify_native_equalizer.py shared/build/parity/test-home/native-pcm-evidence --output desktop/build/verification/equalizer-pcm.json
      - name: Audit decoded artwork memory budget and Windows process memory
        run: gradle :desktop:auditArtworkMemory :desktop:auditArtworkDecode
      - name: Audit real Windows display power request ownership
        run: gradle :desktop:auditDisplayAwake
      - name: Audit native immersive fullscreen and placement restoration
        run: gradle :desktop:auditImmersiveWindow
      - name: Audit real glass optics, native ownership and stable filter reuse
        run: gradle :desktop:auditGlassOptics
      - name: Replay the real glass dock and moving selection in both themes
        shell: pwsh
        run: |
          foreach ($theme in @("Dark", "Light")) {
            $homeDir = "$pwd/desktop/build/parity/glass-dock-$theme-home"
            New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
            [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
            python tools/capture_glass_navigation.py "$homeDir" "desktop/build/parity/glass-dock-$theme" "$theme"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Audit pinned settings icons against the Android SF Symbol mapping
        run: gradle :desktop:auditSettingsIcons
      - name: Replay pinned settings routes in four locales and verify real preference consumers
        shell: pwsh
        run: |
          $cases = @(
            @("en-US", "Dark", "1100", "780"),
            @("zh-CN", "Light", "427", "924"),
            @("zh-TW", "Dark", "800", "600"),
            @("ja-JP", "Light", "1100", "780")
          )
          foreach ($case in $cases) {
            $locale = $case[0]
            $homeDir = "$pwd/desktop/build/parity/settings-$locale-home"
            New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
            [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
            Remove-Item -Recurse -Force "desktop/build/parity/settings-$locale" -ErrorAction SilentlyContinue
            python tools/capture_settings_pages.py routes "$homeDir" "desktop/build/parity/settings-$locale" @case
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $homeDir = "$pwd/desktop/build/parity/settings-controls-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          Remove-Item -Recurse -Force "desktop/build/parity/settings-controls","desktop/build/parity/settings-reload" -ErrorAction SilentlyContinue
          python tools/capture_settings_pages.py controls "$homeDir" desktop/build/parity/settings-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_settings_pages.py reload "$homeDir" desktop/build/parity/settings-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_settings_pages_capture.py desktop/build/parity desktop/build/verification/settings-pages.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure cold-start memory of the production app
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/startup-memory-home"
          python tools/capture_startup_memory.py fresh "$homeDir" desktop/build/parity/startup-memory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Bilibili alignment setting and independent preference reload
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/bilibili-alignment-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($mode in @("controls", "reload")) {
            python tools/capture_bilibili_alignment.py "$mode" "$homeDir" "desktop/build/parity/bilibili-alignment-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay all pinned lyrics controls and reload them in a new process
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/lyrics-controls-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          python tools/capture_lyrics_settings.py controls "$homeDir" desktop/build/parity/lyrics-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_lyrics_settings.py reload "$homeDir" desktop/build/parity/lyrics-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_lyrics_controls_capture.py desktop/build/parity/lyrics-controls desktop/build/parity/lyrics-reload --output desktop/build/verification/lyrics-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Skyline controls, awake scopes, reset and independent reloads
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/skyline-controls-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($mode in @("controls", "reload", "reset", "reload-reset")) {
            python tools/capture_skyline_settings.py "$mode" "$homeDir" "desktop/build/parity/skyline/$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/verify_skyline_controls_capture.py desktop/build/parity/skyline --output desktop/build/verification/skyline-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit production lyric glyph raster at Windows DPI scales
        run: gradle :desktop:auditLyricRaster
      - name: Replay real song actions and independent persisted service settings
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          $fixtures = "$pwd/desktop/build/parity/song-action-media"
          python tools/generate_pcm_fixtures.py "$fixtures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $homeDir = "$pwd/desktop/build/parity/song-actions-home"
          python tools/capture_song_actions.py "$homeDir" desktop/build/parity/song-actions-controls "$fixtures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_song_actions.py "$homeDir" desktop/build/parity/song-actions-reload "$fixtures" reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_song_actions_capture.py desktop/build/parity/song-actions-controls desktop/build/parity/song-actions-reload --output desktop/build/verification/song-actions.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit pinned font outlines and independent HarfBuzz advances
        run: gradle :desktop:auditFontMetrics
      - name: Get jar info
        id: jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem desktop/build/compose/jars/*.jar | Select-Object -First 1
          echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
          echo "jar_name=$($jar.Name)" >> $env:GITHUB_OUTPUT
          echo "jar_dir=$($jar.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "jar_size=$($jar.Length)" >> $env:GITHUB_OUTPUT
          echo "Found: $($jar.Name) ($($jar.Length) bytes)"
      - name: Verify packaged JAR decoder
        run: python tools/verify_decoder_bundle.py --artifact "${{ steps.jar.outputs.jar_path }}" --run --output desktop/build/verification/jar-decoder.json
      - name: Verify packaged JAR pinned resources
        run: python tools/verify_pinned_resources.py --artifact "${{ steps.jar.outputs.jar_path }}" --output desktop/build/verification/jar-pinned-resources.json
      - name: Create app-image with jpackage
        shell: pwsh
        run: |
          $jar = "${{ steps.jar.outputs.jar_path }}"
          $dir = "${{ steps.jar.outputs.jar_dir }}"
          $name = "${{ steps.jar.outputs.jar_name }}"
          jpackage --type app-image `
            --input "$dir" `
            --main-jar "$name" `
            --name MeloX-Desktop `
            --dest desktop/build/releases `
            --java-options "-Xms16m -Xmx1g -XX:+UseSerialGC -Dfile.encoding=UTF-8"
      - name: Verify app-image decoder
        run: python tools/verify_decoder_bundle.py --artifact desktop/build/releases/MeloX-Desktop --run --output desktop/build/verification/image-decoder.json
      - name: Verify app-image pinned resources
        run: python tools/verify_pinned_resources.py --artifact desktop/build/releases/MeloX-Desktop --output desktop/build/verification/image-pinned-resources.json
      - name: Zip the app-image
        shell: pwsh
        run: |
          Compress-Archive -Path "desktop/build/releases/MeloX-Desktop/*" -DestinationPath "desktop/build/releases/MeloX-Desktop-Windows.zip"
          $zip = Get-Item "desktop/build/releases/MeloX-Desktop-Windows.zip"
          Write-Output "Zip: $($zip.FullName) ($($zip.Length) bytes)"
      - name: Verify final distribution decoder
        run: python tools/verify_decoder_bundle.py --artifact desktop/build/releases/MeloX-Desktop-Windows.zip --run --output desktop/build/verification/zip-decoder.json
      - name: Verify final distribution pinned resources
        run: python tools/verify_pinned_resources.py --artifact desktop/build/releases/MeloX-Desktop-Windows.zip --output desktop/build/verification/zip-pinned-resources.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Verification-${{ runner.os }}
          path: |
            desktop/build/verification/*.json
            desktop/build/verification/glass-scene/*.json
            desktop/build/verification/glass-scene/*.png
            desktop/build/verification/glass-popup/*.json
            desktop/build/verification/glass-popup/*.png
            desktop/build/parity/glass-dock-Dark/*
            desktop/build/parity/glass-dock-Light/*
            desktop/build/verification/settings-icons.json
            desktop/build/parity/settings-*/*.json
            desktop/build/parity/settings-*/gradle.log
            desktop/build/parity/settings-*/*.txt
            desktop/build/parity/startup-memory/*.json
            desktop/build/parity/bilibili-alignment-controls/*
            desktop/build/parity/bilibili-alignment-reload/*
            desktop/build/parity/song-actions-controls/*
            desktop/build/parity/song-actions-reload/*
            desktop/build/verification/artwork-memory/*.json
            desktop/build/parity/lyrics-controls/*.json
            desktop/build/parity/lyrics-controls/*.png
            desktop/build/parity/lyrics-controls/gradle.log
            desktop/build/parity/lyrics-controls/arguments.txt
            desktop/build/parity/lyrics-reload/*.json
            desktop/build/parity/lyrics-reload/*.png
            desktop/build/parity/lyrics-reload/gradle.log
            desktop/build/parity/lyrics-reload/arguments.txt
            desktop/build/parity/skyline/**/*.json
            desktop/build/parity/skyline/**/*.png
            desktop/build/parity/skyline/**/gradle.log
            desktop/build/parity/skyline/**/arguments.txt
            desktop/build/verification/lyric-raster/*.json
            desktop/build/verification/lyric-raster/*.png
            desktop/build/verification/font-metrics/*.json
            desktop/build/verification/font-metrics/*.png
            shared/build/test-results/desktopTest/*.xml
            shared/build/parity/test-home/native-pcm-evidence/*
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Desktop-${{ runner.os }}
          path: desktop/build/releases/MeloX-Desktop-Windows.zip
          if-no-files-found: error
