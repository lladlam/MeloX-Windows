name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Stamp exact package source revision
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText("$pwd/desktop/src/main/resources/parity/build-info.properties", "commit=$env:GITHUB_SHA`n", [System.Text.UTF8Encoding]::new($false))
      - name: Verify LFS binaries and native decoder
        run: python tools/verify_decoder_bundle.py --sources --run --output desktop/build/verification/source-decoder.json
      - name: Verify pinned source resource bytes
        run: python tools/verify_pinned_resources.py --sources --output desktop/build/verification/source-pinned-resources.json
      - name: Verify axis-frozen MiLan Pro instances from pinned variable source
        shell: pwsh
        run: |
          python -m pip install --quiet "fonttools>=4.55" uharfbuzz
          python tools/generate_lanting_static.py --verify
      - name: Verify pinned Desktop SF Symbols subset
        run: python tools/verify_desktop_symbols.py --output desktop/build/verification/desktop-symbols.json
      - name: Verify frozen Desktop SF Pro text faces
        run: python tools/build_desktop_text_fonts.py --verify
      - name: Build uber jar
        run: gradle :shared:desktopTest :desktop:desktopTest :desktop:packageUberJarForCurrentOS
      - name: Replay Windows CLI through both real settings layouts
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            if ($layout -eq "mobile") {
              python tools/capture_windows_cli.py $layout "$pwd/desktop/build/parity/cli-$layout-home" "desktop/build/parity/cli-$layout" --keep-enabled
            } else {
              python tools/capture_windows_cli.py $layout "$pwd/desktop/build/parity/cli-$layout-home" "desktop/build/parity/cli-$layout"
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/capture_windows_cli_reload.py "$pwd/desktop/build/parity/cli-mobile-home" "desktop/build/parity/cli-reload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native equalizer PCM
        run: python tools/verify_native_equalizer.py shared/build/parity/test-home/native-pcm-evidence --output desktop/build/verification/equalizer-pcm.json
      - name: Audit decoded artwork memory budget and Windows process memory
        run: gradle :desktop:auditArtworkMemory :desktop:auditArtworkDecode
      - name: Audit actual Flowing Light motion and pause ownership
        run: gradle :desktop:auditFlowingLight
      - name: Audit real Windows display power request ownership
        run: gradle :desktop:auditDisplayAwake
      - name: Audit native immersive fullscreen and placement restoration
        run: gradle :desktop:auditImmersiveWindow
      - name: Verify app-owned window caption using native pointer input
        run: gradle :desktop:auditWindowChrome
      - name: Verify Windows-injected touch and promoted mouse drag scrolling
        run: gradle :desktop:auditNativeTouchScroll
      - name: Audit real glass optics, native ownership and stable filter reuse
        run: gradle :desktop:auditGlassOptics :desktop:auditDesktopGlass
      - name: Replay the real glass dock and moving selection in both themes
        shell: pwsh
        run: |
          foreach ($theme in @("Dark", "Light")) {
            $homeDir = "$pwd/desktop/build/parity/glass-dock-$theme-home"
            New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
            [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
            python tools/capture_glass_navigation.py "$homeDir" "desktop/build/parity/glass-dock-$theme" "$theme"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Audit pinned settings icons against the Android SF Symbol mapping
        run: gradle :desktop:auditSettingsIcons
      - name: Replay v0.6.5 Smart Queue analysis limit and independent reload
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/smartqueue-limit-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          python tools/capture_smartqueue_limit.py controls "$homeDir" desktop/build/parity/smartqueue-limit-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_smartqueue_limit.py reload "$homeDir" desktop/build/parity/smartqueue-limit-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay v0.6.5 lyric languages and reload under a different system locale
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/lyric-language-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          python tools/capture_lyric_language.py controls "$homeDir" desktop/build/parity/lyric-language-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_lyric_language.py reload "$homeDir" desktop/build/parity/lyric-language-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay split layout and independent Dock mini-player positions
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/split-layout-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($mode in @("controls", "reload", "portrait")) {
            python tools/capture_split_layout.py $mode "$homeDir" "desktop/build/parity/split-layout-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay Desktop layout switch, real player and separate JVM preference reloads
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/desktop-layout-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($mode in @("controls", "reload")) {
            python tools/capture_desktop_layout.py $mode "$homeDir" "desktop/build/parity/desktop-layout-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $restoreHome = "$pwd/desktop/build/parity/desktop-layout-restore-home"
          New-Item -ItemType Directory -Force "$restoreHome/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$restoreHome/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`ngeneral_desktop_layout=false`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($mode in @("restore", "reload-current")) {
            python tools/capture_desktop_layout.py $mode "$restoreHome" "desktop/build/parity/desktop-layout-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($mode in @("home-dark", "home-light")) {
            $homeDir = "$pwd/desktop/build/parity/desktop-layout-$mode-home"
            New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
            [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`ngeneral_desktop_layout=true`n", [System.Text.UTF8Encoding]::new($false))
            python tools/capture_desktop_layout.py $mode "$homeDir" "desktop/build/parity/desktop-layout-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $homeDir = "$pwd/desktop/build/parity/desktop-layout-lyrics-light-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`ngeneral_desktop_layout=false`n", [System.Text.UTF8Encoding]::new($false))
          python tools/capture_desktop_layout.py lyrics-light "$homeDir" desktop/build/parity/desktop-layout-lyrics-light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $coldHome = "$pwd/desktop/build/parity/desktop-layout-cold-controls-home"
          New-Item -ItemType Directory -Force "$coldHome/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$coldHome/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`ngeneral_desktop_layout=true`n", [System.Text.UTF8Encoding]::new($false))
          python tools/capture_desktop_layout.py cold-controls "$coldHome" desktop/build/parity/desktop-layout-cold-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_layout_capture.py desktop/build/parity --require-cold-controls --output desktop/build/verification/desktop-layout.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay mobile page stack and real Local lyric artwork restoration
        shell: pwsh
        run: |
          foreach ($mode in @('single', 'split', 'reduced')) {
            python tools/capture_page_motion.py $mode "$pwd/desktop/build/parity/page-motion-$mode-home" "desktop/build/parity/page-motion-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/capture_mobile_v065.py player "$pwd/desktop/build/parity/mobile-player-home" desktop/build/parity/mobile-player
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay mobile Dock geometry and real dual PCM AutoMix
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($case in @(@('Local', 430, 1), @('Netease', 390, 1), @('Local', 360, 1.25), @('Netease', 430, 2))) {
            $id = "$($case[0])-$($case[1])-$($case[2])"
            python tools/capture_mobile_dock_selection.py ($case[0]) ($case[1]) ($case[2]) "$pwd/desktop/build/parity/mobile-dock-$id-home" "desktop/build/parity/mobile-dock-$id"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($mode in @('on', 'off', 'leave', 'reduced')) {
            python tools/capture_mobile_automix.py $mode "$pwd/desktop/build/parity/mobile-automix-$mode-home" "desktop/build/parity/mobile-automix-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-ChildItem "desktop/build/parity/mobile-automix-$mode" -Filter '*.s16le' | ForEach-Object { python -m gzip $_.FullName }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay process-owned LAN outputs in both production layouts
        shell: pwsh
        run: |
          foreach ($mode in @('mobile', 'desktop')) {
            python tools/capture_lan_update.py $mode "$pwd/desktop/build/parity/lan-update-$mode-home" "desktop/build/parity/lan-update-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-ChildItem "desktop/build/parity/lan-update-$mode" -Filter '*.s16le' | ForEach-Object { python -m gzip $_.FullName }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay real DLNA discovery SOAP and Range audio in both layouts
        shell: pwsh
        run: |
          foreach ($mode in @('mobile', 'desktop')) {
            python tools/capture_dlna_update.py $mode "$pwd/desktop/build/parity/dlna-update-$mode-home" "desktop/build/parity/dlna-update-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-ChildItem "desktop/build/parity/dlna-update-$mode" -Filter '*.s16le' | ForEach-Object { python -m gzip $_.FullName }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay real Desktop album and playlist collection geometry and pointers
        shell: pwsh
        run: |
          python tools/capture_desktop_collection.py album "$pwd/desktop/build/parity/collection-album-light-home" desktop/build/parity/collection-album-light --expand-description
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_desktop_collection.py playlist "$pwd/desktop/build/parity/collection-playlist-dark-home" desktop/build/parity/collection-playlist-dark --theme Dark --drag-scroll --song-menu --artist-route
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_desktop_collection.py playlist "$pwd/desktop/build/parity/collection-playlist-light-home" desktop/build/parity/collection-playlist-light --theme Light --locale zh-CN --drag-scroll --song-menu --artist-route
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Desktop Home themes, paging, real routes and Touch input
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python tools/capture_desktop_home.py "$pwd/desktop/build/parity/home-final-dark-home" desktop/build/parity/home-final-dark --touch --account --promoted-drag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_home_capture.py desktop/build/parity/home-final-dark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_account_capture.py desktop/build/parity/home-final-dark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_desktop_home.py "$pwd/desktop/build/parity/home-final-light-home" desktop/build/parity/home-final-light --theme Light --reduce-motion --account --width 2188 --height 1356
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_home_capture.py desktop/build/parity/home-final-light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_account_capture.py desktop/build/parity/home-final-light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay provider collections in both production layouts
        shell: pwsh
        run: |
          foreach ($source in @("Local", "Spotify", "YouTubeMusic", "Qishui")) {
            foreach ($layout in @("desktop", "mobile")) {
              $case = "provider-$source-$layout"
              python tools/capture_provider_collections.py $source $layout "$pwd/desktop/build/parity/$case-home" "desktop/build/parity/$case"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          foreach ($source in @("QQMusic", "Kugou", "Bilibili", "Jellyfin")) {
            $case = "provider-$source-desktop"
            python tools/capture_provider_collections.py $source desktop "$pwd/desktop/build/parity/$case-home" "desktop/build/parity/$case"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay YouTube login form in both layouts
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            python tools/capture_youtube_login.py $layout "$pwd/desktop/build/parity/youtube-login-$layout-home" "desktop/build/parity/youtube-login-$layout"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay distinct Kugou accounts and concept check-in settings
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            $homeDir = "$pwd/desktop/build/parity/kugou-lite-$layout-home"
            foreach ($mode in @("controls", "reload")) {
              python tools/capture_kugou_lite.py $layout $mode $homeDir "desktop/build/parity/kugou-lite-$layout-$mode"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Replay LX source import and reload in both layouts
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            $homeDir = "$pwd/desktop/build/parity/lx-$layout-home"
            foreach ($mode in @("controls", "reload")) {
              python tools/capture_lx_services.py $layout $mode $homeDir "desktop/build/parity/lx-$layout-$mode"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Replay localized sponsor list in both layouts and Desktop About
        shell: pwsh
        run: |
          foreach ($case in @(@("mobile", "zh-CN"), @("desktop", "ja-JP"), @("desktop-tool", "en-US"))) {
            $id = "$($case[0])-$($case[1])"
            python tools/capture_about_sponsors.py ($case[0]) ($case[1]) "$pwd/desktop/build/parity/about-sponsors-$id-home" "desktop/build/parity/about-sponsors-$id"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay reference Desktop player, queue, volume and independent favorite reload
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/reference-player-home"
          python tools/capture_desktop_layout.py reference-player "$homeDir" desktop/build/parity/reference-player
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_player_capture.py desktop/build/parity/reference-player
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_desktop_layout.py reference-player-reload "$homeDir" desktop/build/parity/reference-player-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_player_capture.py desktop/build/parity/reference-player-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_desktop_layout.py reference-lyrics "$pwd/desktop/build/parity/reference-lyrics-home" desktop/build/parity/reference-lyrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_lyrics_pane_capture.py desktop/build/parity/reference-lyrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_desktop_layout.py reference-lyrics-light "$pwd/desktop/build/parity/reference-lyrics-light-home" desktop/build/parity/reference-lyrics-light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_desktop_lyrics_pane_capture.py desktop/build/parity/reference-lyrics-light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay pinned settings routes in four locales and verify real preference consumers
        shell: pwsh
        run: |
          $cases = @(
            @("en-US", "Dark", "1100", "780"),
            @("zh-CN", "Light", "427", "924"),
            @("zh-TW", "Dark", "800", "600"),
            @("ja-JP", "Light", "1100", "780")
          )
          foreach ($case in $cases) {
            $locale = $case[0]
            $homeDir = "$pwd/desktop/build/parity/settings-$locale-home"
            New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
            [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
            Remove-Item -Recurse -Force "desktop/build/parity/settings-$locale" -ErrorAction SilentlyContinue
            python tools/capture_settings_pages.py routes "$homeDir" "desktop/build/parity/settings-$locale" @case
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $homeDir = "$pwd/desktop/build/parity/settings-controls-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          Remove-Item -Recurse -Force "desktop/build/parity/settings-controls","desktop/build/parity/settings-reload" -ErrorAction SilentlyContinue
          python tools/capture_settings_pages.py controls "$homeDir" desktop/build/parity/settings-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_settings_pages.py reload "$homeDir" desktop/build/parity/settings-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_settings_pages_capture.py desktop/build/parity desktop/build/verification/settings-pages.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay app language, privacy and background controls in both layouts
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            $homeDir = "$pwd/desktop/build/parity/feature-surface-$layout-home"
            python tools/capture_feature_surface.py $layout controls $homeDir "desktop/build/parity/feature-surface-$layout-controls"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/capture_feature_surface.py $layout reload $homeDir "desktop/build/parity/feature-surface-$layout-reload"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay wrapped Japanese readings with real Local decoding in both layouts
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            python tools/capture_ruby_alignment.py $layout "$pwd/desktop/build/parity/ruby-$layout-home" "desktop/build/parity/ruby-$layout"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay background and performance controls with independent reload
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            $homeDir = "$pwd/desktop/build/parity/background-controls-$layout-home"
            python tools/capture_background_controls.py $layout controls $homeDir "desktop/build/parity/background-controls-$layout-controls"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/capture_background_controls.py $layout reload $homeDir "desktop/build/parity/background-controls-$layout-reload"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay live AutoMix background and dual PCM in both layouts
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            python tools/capture_automix_background.py $layout "$pwd/desktop/build/parity/automix-background-$layout-home" "desktop/build/parity/automix-background-$layout"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay unified favorites with real Local playback and independent reload
        shell: pwsh
        run: |
          foreach ($layout in @("mobile", "desktop")) {
            $homeDir = "$pwd/desktop/build/parity/unified-favorites-$layout-home"
            python tools/capture_unified_favorites.py $layout controls $homeDir "desktop/build/parity/unified-favorites-$layout-controls"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/capture_unified_favorites.py $layout reload $homeDir "desktop/build/parity/unified-favorites-$layout-reload"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay every Desktop settings page and shared account actions
        shell: pwsh
        run: |
          python tools/capture_settings_pages.py desktop-routes "$pwd/desktop/build/parity/settings-desktop-dark-home" desktop/build/parity/settings-desktop-dark en-US Dark 1280 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_settings_pages.py desktop-routes "$pwd/desktop/build/parity/settings-desktop-light-home" desktop/build/parity/settings-desktop-light zh-CN Light 1280 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_settings_pages.py desktop-controls "$pwd/desktop/build/parity/settings-desktop-controls-home" desktop/build/parity/settings-desktop-controls en-US Dark 1280 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_settings_pages.py desktop-reload "$pwd/desktop/build/parity/settings-desktop-controls-home" desktop/build/parity/settings-desktop-reload en-US Dark 1280 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Desktop promoted drag and native Touch scene paths
        shell: pwsh
        run: |
          python tools/capture_desktop_drag_scroll.py "$pwd/desktop/build/parity/desktop-drag-home" desktop/build/parity/desktop-drag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_desktop_search_scroll.py "$pwd/desktop/build/parity/desktop-search-scroll-home" desktop/build/parity/desktop-search-scroll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Desktop surfaces and first launch
        shell: pwsh
        run: |
          foreach ($theme in @("Dark", "Light")) {
            python tools/capture_desktop_surfaces.py "$pwd/desktop/build/parity/desktop-surfaces-$theme-home" "desktop/build/parity/desktop-surfaces-$theme" $theme
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/verify_desktop_surfaces_capture.py "desktop/build/parity/desktop-surfaces-$theme"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/capture_desktop_onboarding.py "$pwd/desktop/build/parity/desktop-onboarding-home" desktop/build/parity/desktop-onboarding
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure cold-start memory of the production app
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/startup-memory-home"
          python tools/capture_startup_memory.py fresh "$homeDir" desktop/build/parity/startup-memory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Bilibili alignment setting and independent preference reload
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/bilibili-alignment-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($mode in @("controls", "reload")) {
            python tools/capture_bilibili_alignment.py "$mode" "$homeDir" "desktop/build/parity/bilibili-alignment-$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Replay all pinned lyrics controls and reload them in a new process
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/lyrics-controls-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          python tools/capture_lyrics_settings.py controls "$homeDir" desktop/build/parity/lyrics-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_lyrics_settings.py reload "$homeDir" desktop/build/parity/lyrics-reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_lyrics_controls_capture.py desktop/build/parity/lyrics-controls desktop/build/parity/lyrics-reload --output desktop/build/verification/lyrics-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Skyline controls, awake scopes, reset and independent reloads
        shell: pwsh
        run: |
          $homeDir = "$pwd/desktop/build/parity/skyline-controls-home"
          New-Item -ItemType Directory -Force "$homeDir/.melox" | Out-Null
          [System.IO.File]::WriteAllText("$homeDir/.melox/prefs_melox_app_settings.properties", "onboarding_completed=true`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($mode in @("controls", "reload", "reset", "reload-reset")) {
            python tools/capture_skyline_settings.py "$mode" "$homeDir" "desktop/build/parity/skyline/$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/verify_skyline_controls_capture.py desktop/build/parity/skyline --output desktop/build/verification/skyline-controls.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit production lyric glyph raster at Windows DPI scales
        run: gradle :desktop:auditLyricRaster
      - name: Replay real song actions and independent persisted service settings
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          $fixtures = "$pwd/desktop/build/parity/song-action-media"
          python tools/generate_pcm_fixtures.py "$fixtures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $homeDir = "$pwd/desktop/build/parity/song-actions-home"
          python tools/capture_song_actions.py "$homeDir" desktop/build/parity/song-actions-controls "$fixtures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/capture_song_actions.py "$homeDir" desktop/build/parity/song-actions-reload "$fixtures" reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_song_actions_capture.py desktop/build/parity/song-actions-controls desktop/build/parity/song-actions-reload --output desktop/build/verification/song-actions.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit pinned font outlines and independent HarfBuzz advances
        run: gradle :desktop:auditFontMetrics
      - name: Get jar info
        id: jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem desktop/build/compose/jars/*.jar | Select-Object -First 1
          echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
          echo "jar_name=$($jar.Name)" >> $env:GITHUB_OUTPUT
          echo "jar_dir=$($jar.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "jar_size=$($jar.Length)" >> $env:GITHUB_OUTPUT
          echo "Found: $($jar.Name) ($($jar.Length) bytes)"
      - name: Verify packaged JAR decoder
        run: python tools/verify_decoder_bundle.py --artifact "${{ steps.jar.outputs.jar_path }}" --run --output desktop/build/verification/jar-decoder.json
      - name: Verify packaged JAR pinned resources
        run: python tools/verify_pinned_resources.py --artifact "${{ steps.jar.outputs.jar_path }}" --output desktop/build/verification/jar-pinned-resources.json
      - name: Create app-image with jpackage
        shell: pwsh
        run: |
          $jar = "${{ steps.jar.outputs.jar_path }}"
          $dir = "${{ steps.jar.outputs.jar_dir }}"
          $name = "${{ steps.jar.outputs.jar_name }}"
          jpackage --type app-image `
            --input "$dir" `
            --main-jar "$name" `
            --name MeloX-Desktop `
            --icon desktop/src/main/resources/branding/melox-android.ico `
            --dest desktop/build/releases `
            --java-options "-Xms16m -Xmx1g -XX:+UseSerialGC -Dfile.encoding=UTF-8 --add-opens=java.desktop/java.awt.event=ALL-UNNAMED"
      - name: Verify app-image decoder
        run: python tools/verify_decoder_bundle.py --artifact desktop/build/releases/MeloX-Desktop --run --output desktop/build/verification/image-decoder.json
      - name: Verify app-image pinned resources
        run: python tools/verify_pinned_resources.py --artifact desktop/build/releases/MeloX-Desktop --output desktop/build/verification/image-pinned-resources.json
      - name: Verify actual Windows launcher icon
        run: python tools/verify_windows_icon.py --artifact desktop/build/releases/MeloX-Desktop --output desktop/build/verification/image-icon.json
      - name: Include Windows CLI helper and instructions
        shell: pwsh
        run: |
          Copy-Item tools/melox_cli.py desktop/build/releases/MeloX-Desktop/melox_cli.py
          Copy-Item docs/WINDOWS_CLI.md desktop/build/releases/MeloX-Desktop/WINDOWS_CLI.md
      - name: Zip the app-image
        shell: pwsh
        run: |
          Compress-Archive -Path "desktop/build/releases/MeloX-Desktop/*" -DestinationPath "desktop/build/releases/MeloX-Desktop-Windows.zip"
          $zip = Get-Item "desktop/build/releases/MeloX-Desktop-Windows.zip"
          Write-Output "Zip: $($zip.FullName) ($($zip.Length) bytes)"
      - name: Verify final distribution decoder
        run: python tools/verify_decoder_bundle.py --artifact desktop/build/releases/MeloX-Desktop-Windows.zip --run --output desktop/build/verification/zip-decoder.json
      - name: Verify final distribution pinned resources
        run: python tools/verify_pinned_resources.py --artifact desktop/build/releases/MeloX-Desktop-Windows.zip --output desktop/build/verification/zip-pinned-resources.json
      - name: Verify final Windows launcher icon
        run: python tools/verify_windows_icon.py --artifact desktop/build/releases/MeloX-Desktop-Windows.zip --output desktop/build/verification/zip-icon.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
