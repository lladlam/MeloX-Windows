name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: gradle :desktop:packageUberJarForCurrentOS
      - name: Get jar info
        id: jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem desktop/build/compose/jars/*.jar | Select-Object -First 1
          echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
          echo "jar_name=$($jar.Name)" >> $env:GITHUB_OUTPUT
          echo "jar_dir=$($jar.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "jar_size=$($jar.Length)" >> $env:GITHUB_OUTPUT
          echo "Found: $($jar.Name) ($($jar.Length) bytes)"
      - name: Test run uber jar directly
        shell: pwsh
        run: |
          Write-Output "=== Testing uber jar directly ==="
          $jar = "${{ steps.jar.outputs.jar_path }}"
          Write-Output "Running: java -jar $jar"
          $proc = Start-Process -FilePath "java" -ArgumentList "-jar", "`"$jar`"" -NoNewWindow -Wait -PassThru -RedirectStandardError "stderr.txt" -RedirectStandardOutput "stdout.txt"
          Write-Output "Exit code: $($proc.ExitCode)"
          Write-Output "=== STDOUT ==="
          Get-Content "stdout.txt" -ErrorAction SilentlyContinue
          Write-Output "=== STDERR ==="
          Get-Content "stderr.txt" -ErrorAction SilentlyContinue
      - name: Create app-image with jpackage
        shell: pwsh
        run: |
          $jar = "${{ steps.jar.outputs.jar_path }}"
          $dir = "${{ steps.jar.outputs.jar_dir }}"
          $name = "${{ steps.jar.outputs.jar_name }}"
          jpackage --type app-image `
            --input "$dir" `
            --main-jar "$name" `
            --name MeloX-Desktop `
            --dest desktop/build/releases `
            --java-options "-Xmx1g -Dfile.encoding=UTF-8"
      - name: Zip the app-image
        shell: pwsh
        run: |
          Compress-Archive -Path "desktop/build/releases/MeloX-Desktop/*" -DestinationPath "desktop/build/releases/MeloX-Desktop-Windows.zip"
          $zip = Get-Item "desktop/build/releases/MeloX-Desktop-Windows.zip"
          Write-Output "Zip: $($zip.FullName) ($($zip.Length) bytes)"
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Desktop-${{ runner.os }}
          path: desktop/build/releases/MeloX-Desktop-Windows.zip
          if-no-files-found: error
