settings_privacy_policy_body=When this is on, MeloX reads play counts, completion, skips, likes, and source preferences on this device to train and run a lightweight recommendation model. That data is not uploaded. MeloX does not read passwords, cookies, messages, or raw microphone audio. You can withdraw consent and delete the model data at any time.
