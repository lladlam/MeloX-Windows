settings_about_licenses_body=MeloX: GNU GPLv3\nqier222/YesPlayMusic: NetEase API and player reference (MIT)\njayfunc/BetterLyrics: word-by-word lyrics, glow, and motion reference\nWXRIW/Lyricify-Lyrics-Helper: NetEase YRC parsing reference\nneteasecloudmusicapienhanced/api-enhanced: song recognition and audio-fingerprint runtime\nDanteAlighieri13210914/pv-tool: original text PV implementation (Non-Commercial License)\nmjhydri/BeatNet: AutoMix beat, downbeat, and tempo analysis (CC BY 4.0)\nNEORUAA/MeiloX: Apple Music–style NetEase client based on Mei, used as a UI reference\nlladlam/Square: dual-backend architecture reference for Spotify and YouTube Music\nYouTube Music: based on Square, using vendored Metrolist InnerTube (GPL-3.0) and NewPipeExtractor\nSpotify: based on the Square Spotify backend, using librespot-java (Apache-2.0)\nvivo OriginOS: tries to adapt atomic-island notifications automatically, with no separate switch\nthlucas1/SpotifyWebApiPython: Spotify Web API client, used as an API reference\nbromothymolb/bilibili-api-zoku: combined Bilibili API project, used as an API reference\nKyant0 AndroidLiquidGlass / Backdrop: Android liquid-glass rendering foundation
