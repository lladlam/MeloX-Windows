# Build-time limits, shared by CI and local Gradle invocations. These do not
# change the packaged application's Java options in desktop/build.gradle.kts.
# Compile modules sequentially in one explicitly sized JVM instead of a second
# Kotlin daemon inheriting Gradle's small default heap on Windows.
org.gradle.jvmargs=-Xmx1024m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
